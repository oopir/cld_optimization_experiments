experiment:
  dataset: synthetic_anisotropic
  synthetic_d_in: 128
  synthetic_anisotropy_powers: [0, 0.5, 1, 2]
  random_labels: true

  n_values: [1024, 2048, 4096, 8192]
  m_values: [8192]
  # beta_values: [inf]
  # training_step: 0
  eta: 0.005
  init_type: standard

  num_data_seeds: 16
  data_seed_start: 0
  num_inits: 16
  init_seed_start: 0

  device: cuda
  gpu_ids: [6,7]
  batch_size: 4096
  jacobian_batch_size: 1024
  # parallel: true
  parallel: true
  init_chunk_size: 4
  adaptive_gpu_packing: true
  gpu_memory_safety_fraction: 0.85

  progress_interval_seconds: 60
  progress_detail: summary

  tracked_metrics:
    - empirical_loss
    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_median
    - ntk_eig_max
    - residual_ntk_alignment
    - residual_ntk_alignment_over_ntk_eig_min
    - residual_ntk_alignment_over_ntk_eig_mean
    - residual_ntk_alignment_over_ntk_eig_max
    - loss_weighted_residual_ntk_alignment
    - loss_weighted_ntk_eig_min
  plot_metrics:
    - empirical_loss
    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_median
    - ntk_eig_max
    - residual_ntk_alignment
    - residual_ntk_alignment_over_ntk_eig_min
    - residual_ntk_alignment_over_ntk_eig_mean
    - residual_ntk_alignment_over_ntk_eig_max
    - loss_weighted_residual_ntk_alignment
    - loss_weighted_ntk_eig_min
  plot_format: combined
  plot_heatmaps: false

  output_dir: plots/at_init_stats/debug_ntk_anisotropy
