experiment:
    seeds: [0, 1, 2, 3, 4]
    n: 10
    random_labels: false
    betas: [100, 500, 1000, .inf]
    epochs: 1000000
    eta: 1.0e-5
    m: 10000
    dataset: digits
    init_type: standard
    lam_fc1: null
    lam_fc2: null
    regularization_scale: 1.0
    same_noise: false
    use_linearized: true
    track_jacobian: true
    jac_probe_size: 10
    device: cuda
    track_every: 1000
    print_every: 250000
  
run:
    ckpt_dir: "~/cld_checkpoints/expr1"
    save_ckpt: true
    load_ckpt: false
    load_ckpt_name: ".pt"
    resume_from_ckpt: false
    # new_total_epochs: 4000000
    # config_overrides: ["print_every"]