experiment:
  seeds: [0,1,2,3,4]
  n: 30000
  random_labels: false
  alphas: [0.05]
  betas: [.inf]
  epochs: 1000
  eta: 1.0e-2
  eta_mode: scalar # scalar / per_beta / per_alpha_beta (should match what it was set to in 'eta_tuning:' block)
  eta_table_path: null # fill this when you use fine-tuned values
  eta_default: null
  m: 10000
  dataset: mnist
  init_type: alpha
  regularization_scale: 1
  use_linearized: false
  same_noise: false
  track_jacobian: false
  jac_probe_size: 1
  device: cuda
  track_every: 50
  print_every: 250
  collect_feature_stats: false

run:
  ckpt_dir: "~/cld_checkpoints/expr1"
  # save_ckpt: true
  # load_ckpt: true
  # load_ckpt_name: "_mnist_20260215_141159.pt"
  # resume_from_ckpt: true
  # new_total_epochs: 2000
  # config_overrides: ['print_every']

eta_tuning:
  enabled: true # set to false when not tuning
  mode: per_alpha_beta
  eta_grid: [1.0e-5, 1.0e-4, 1.0e-3]
  tuning_epochs: 5000
  tuning_seeds: [0] # currently only one seed supported because of parallelization over (alpha,beta), need to modify this
  metric: train_loss
  goal: min
  output_path: "configs/alpha_sweep/tuning/etas_mnist_debug.yaml"
  force: true
