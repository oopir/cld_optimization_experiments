experiment:
  dataset: mnist
  random_labels: false
  negative_classes: [0, 2, 4, 6, 8]
  positive_classes: [1, 3, 5, 7, 9]

  # n_values: [32000]
  # m_values: [128, 512, 1024]
  n_values: [1000]
  m_values: [64, 128]
  init_type: standard
  beta_values: [inf, 250]
  training_step_values: [0]
  eta: 0.001
  init_type: standard

  num_data_seeds: 4
  data_seed_start: 0
  num_inits: 4
  init_seed_start: 0

  device: cuda
  parallel: true
  gpu_ids: [6,7]
  adaptive_gpu_packing: true
  gpu_memory_safety_fraction: 0.9
  max_workers_per_gpu: 4
  batch_size: 1024
  jacobian_batch_size: 1024
  init_chunk_size: 4

  progress_interval_seconds: 300
  progress_detail: summary

  tracked_metrics:
    - empirical_loss
    - train_error
    - test_error

    - fc1_weight_fro_norm
    - fc1_weight_fro_norm_normalized
    - fc1_weight_spectral_norm
    - fc1_weight_spectral_norm_normalized
    - fc2_weight_euclidean_norm

    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_max
    
    - residual_ntk_alignment
    - residual_initial_ntk_alignment
    - residual_ntk_alignment_over_initial
    - residual_ntk_alignment_trace_normalized_over_initial

    - task_ntk_alignment
    - task_initial_ntk_alignment
    - task_ntk_alignment_over_initial
    - task_ntk_alignment_trace_normalized_over_initial

    - ntk_cos_dist
    - ntk_rel_fro_dist

  plot_metrics:
    - empirical_loss
    - train_error
    - test_error

    - fc1_weight_fro_norm
    - fc1_weight_fro_norm_normalized
    - fc1_weight_spectral_norm
    - fc1_weight_spectral_norm_normalized
    - fc2_weight_euclidean_norm

    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_max
    
    - residual_ntk_alignment
    - residual_ntk_alignment_over_initial
    - residual_ntk_alignment_trace_normalized_over_initial

    - task_ntk_alignment
    - task_ntk_alignment_over_initial
    - task_ntk_alignment_trace_normalized_over_initial

    - ntk_cos_dist
    - ntk_rel_fro_dist

  plot_format: combined
  plot_heatmaps: false

  output_dir: plots/init_scale/debug_ntk_nm_mnist
