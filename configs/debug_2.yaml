experiment:
  seeds: [0,1,2,3,4,5,6,7,8]
  n: 30000
  random_labels: false
  reserve_last: 1000
  alphas: [1]
  betas: [.inf, 3.0e+7, 3.0e+6, 3.0e+5]
  epochs: 2500
  # eta: 1.0e-2
  eta_mode: per_alpha_beta # scalar / per_beta / per_alpha_beta (should match what it was set to in 'eta_tuning:' block)
  eta_table_path: "configs/tuning/etas_mnist_ce_noise_2.yaml" # fill this when you use fine-tuned values
  eta_default: 1.0e-2
  m: 10000
  dataset: mnist
  init_type: alpha
  regularization_scale: 1
  early_stop_metric: train_acc
  early_stop_goal: max
  early_stop_value: 2
  use_linearized: true
  same_noise: false
  track_jacobian: false
  jac_probe_size: 1
  device: cuda
  track_every: 25
  print_every: 1500
  collect_feature_stats: false

run:
  ckpt_dir: "~/cld_checkpoints/expr1"
  save_ckpt: true
  # load_ckpt: true
  # load_ckpt_name: "_mnist_20260219_211212.pt"
  # resume_from_ckpt: true
  # new_total_epochs: 10000
  # config_overrides: ["print_every", "early_stop_metric", "early_stop_goal", "early_stop_value"]

eta_tuning:
  enabled: false # set to false when not tuning
  # mode: per_alpha_beta
  # eta_grid: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0e+0]
  # tuning_epochs: 500
  # tuning_seeds: [0] # currently only one seed supported because of parallelization over (alpha,beta), need to modify this
  # metric: train_loss
  # goal: min
  # output_path: "configs/tuning/etas_mnist_ce_noise_2.yaml"
  # force: true