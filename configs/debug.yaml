experiment:
  seeds: [0]
  n: 10000
  random_labels: false
  alphas: [1]
  betas: [.inf]
  epochs: 500
  eta: 1.0e-5
  m: 10000
  dataset: mnist
  init_type: standard
  regularization_scale: 0
  use_linearized: false
  same_noise: false
  track_jacobian: false
  jac_probe_size: 1
  device: cuda
  track_every: 10
  print_every: 100

run:
  ckpt_dir: "~/cld_checkpoints/expr1"
  save_ckpt: false
  load_ckpt: false
  load_ckpt_name: ".pt"
  resume_from_ckpt: false
  new_total_epochs: 0
