experiment:
  seeds: [0,1,2,3,4,5,6,7]
  n: 30000
  random_labels: false
  reserve_last: 1000
  # alphas: [0.05, 0.15, 0.5, 1.5, 5, 15, 50]
  alphas: [50, 15, 5, 1.5, 0.5, 0.15]
  betas: [.inf]
  epochs: 30000
  eta: 1.0e-2
  eta_mode: per_alpha_beta # scalar / per_beta / per_alpha_beta (should match what it was set to in 'eta_tuning:' block)
  eta_table_path: "configs/tuning/etas_mnist.yaml" # fill this when you use fine-tuned values
  eta_default: 1.0e-2
  m: 10000
  dataset: mnist
  init_type: alpha
  regularization_scale: 1
  early_stop_metric: train_acc
  early_stop_goal: max
  early_stop_value: 0.999
  use_linearized: true
  same_noise: false
  track_jacobian: false
  jac_probe_size: 1
  device: cuda
  track_every: 100
  print_every: 5000
  collect_feature_stats: false

run:
  ckpt_dir: "~/cld_checkpoints/expr1"
  save_ckpt: true
  # load_ckpt: true
  # load_ckpt_name: ".pt"
  # resume_from_ckpt: true
  # new_total_epochs: 3000
  # config_overrides: ["print_every"]

eta_tuning:
  enabled: false # set to false when not tuning
  # mode: per_alpha_beta
  # eta_grid: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0e+0, 1.0e+1]
  # tuning_epochs: 500
  # tuning_seeds: [0] # currently only one seed supported because of parallelization over (alpha,beta), need to modify this
  # metric: train_loss
  # goal: min
  # output_path: "configs/tuning/etas_mnist.yaml"
  # force: true