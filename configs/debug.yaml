experiment:
    seeds: [0, 1, 2, 3, 4, 5, 6, 7]
    n: 1000
    random_labels: false
    betas: [10000, 50000, .inf]
    epochs: 10000
    eta: 1.0e-5
    m: 100000
    dataset: digits
    use_linearized: false
    same_noise: true
    # track_jacobian: true # legacy; not used of tracked_metrics is set
    # jac_probe_size: 100
    device: cuda
    track_every: 10
    print_every: 100000
    tracked_metrics: [train_loss, test_loss]
  
run:
    ckpt_dir: "~/cld_checkpoints/expr1"
    save_ckpt: false
    load_ckpt: false
    load_ckpt_name: ".pt"
    resume_from_ckpt: false
    new_total_epochs: 0
    config_overrides: []

momentum_comparison:
    enabled: true
    include_overdamped: true
    widths: [1000, 10000, 100000]
    variants:
        - label: "BAOAB lower momentum h=1e-3 gamma=100"
          h: 1.0e-3
          gamma: 100
          discretization: baoab
        - label: "BAOAB standard momentum h=3.16e-3 gamma=316"
          h: 3.16e-3
          gamma: 316
          discretization: baoab
        - label: "BAOAB higher momentum h=1e-2 gamma=1000"
          h: 1.0e-2
          gamma: 1000
          discretization: baoab
        - label: "Euler lower momentum h=1e-3 gamma=100"
          h: 1.0e-3
          gamma: 100
          discretization: euler_maruyama
        - label: "Euler standard momentum h=3.16e-3 gamma=316"
          h: 3.16e-3
          gamma: 316
          discretization: euler_maruyama
        - label: "Euler higher momentum h=5e-3 gamma=300"
          h: 5.0e-3
          gamma: 300
          discretization: euler_maruyama
