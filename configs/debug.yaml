experiment:
  seeds: [0,1,2,3,4,5,6,7]
  n: 30000
  random_labels: false
  reserve_last: 1000
  alphas: [0.15, 0.5, 1.5, 5, 15, 50]
  betas: [.inf]
  epochs: 20000
  eta: 1.0e-2
  eta_mode: per_alpha_beta # scalar / per_beta / per_alpha_beta 
  eta_table_path: "configs/tuning/etas_mnist_ce.yaml" 
  eta_default: 1.0e-2
  m: 10000
  dataset: mnist
  init_type: alpha
  regularization_scale: 1
  early_stop_metric: train_loss
  early_stop_goal: min
  early_stop_value: 1.0e-3
  use_linearized: true
  same_noise: false
  track_jacobian: false
  jac_probe_size: 1
  device: cuda
  track_every: 50
  print_every: 1000
  collect_feature_stats: false

run:
  ckpt_dir: "~/cld_checkpoints/expr1"
  save_ckpt: true
  # load_ckpt: true
  # load_ckpt_name: ".pt"
  # resume_from_ckpt: true
  # new_total_epochs: 0
  # config_overrides: ["print_every", "early_stop_metric", "early_stop_goal", "early_stop_value"]

eta_tuning:
  enabled: false # set to false when not tuning
