probe:
  dataset: .
  random_labels: true

  n_values: [1024, 2048, 4096, 8192]
  m_values: [1024, 2048, 4096, 8192, 16384]
  beta_values: [inf]
  training_step_values: [0]
  eta: 0.005
  init_type: standard

  num_data_seeds: 32
  data_seed_start: 0
  num_inits: 32
  init_seed_start: 0

  device: cuda
  batch_size: 4096
  jacobian_batch_size: 512
  parallel: true
  init_chunk_size: 8
  adaptive_gpu_packing: true
  gpu_memory_safety_fraction: 0.85

  progress_interval_seconds: 300
  progress_detail: summary

  # ntk_label_energy_k_values: [5, 25, 50, 100]
  tracked_metrics:
    - empirical_loss
    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_median
    - ntk_eig_max
    - residual_ntk_alignment
    - residual_ntk_alignment_over_ntk_eig_min
    - residual_ntk_alignment_over_ntk_eig_mean
    - residual_ntk_alignment_over_ntk_eig_max
    - loss_weighted_residual_ntk_alignment
    - loss_weighted_ntk_eig_min
  plot_metrics:
    - empirical_loss
    - ntk_eig_min
    - ntk_eig_mean
    - ntk_eig_median
    - ntk_eig_max
    - residual_ntk_alignment
    - residual_ntk_alignment_over_ntk_eig_min
    - residual_ntk_alignment_over_ntk_eig_mean
    - residual_ntk_alignment_over_ntk_eig_max
    - loss_weighted_residual_ntk_alignment
    - loss_weighted_ntk_eig_min
  plot_format: combined
  plot_heatmaps: false

  output_dir: plots/init_scale_probe/debug_ntk_nm_mnist
