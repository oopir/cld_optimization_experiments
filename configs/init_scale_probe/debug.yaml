probe:
  dataset: mnist
  # synthetic_d_in: 64
  # synthetic_anisotropy_powers: [0, 0.5, 1, 2]
  random_labels: true
  # reserve_last: 0
  negative_classes: [0, 1, 2, 3, 4]
  positive_classes: [5, 6, 7, 8, 9]

  n_values: [1000]
  m_values: [1250, 2500, 5000, 10000, 20000, 40000]
  beta_values: [50, 150, 500, 1500, inf]
  training_step_values: [0, 10, 50, 100]
  eta: 0.0001
  init_type: standard

  data_seeds: null
  num_data_seeds: 60
  data_seed_start: 0
  init_seeds: null
  num_inits: 60
  init_seed_start: 10000
  # report_data_seed: 0

  device: cuda
  batch_size: 10000
  jacobian_batch_size: 1000
  parallel: true
  # gpu_ids: [0,1,2,3]
  init_chunk_size: 20
  adaptive_gpu_packing: true
  gpu_memory_safety_fraction: 0.9
  # gpu_reserved_memory_mb: 1000
  # max_workers_per_gpu: 8
  # retry_on_oom: true
  # oom_shrink_factor: 0.5
  min_batch_size: 1

  progress_interval_seconds: null  # null/0 prints one start+finish per (n, m, alpha, beta); positive seconds adds active snapshots.
  progress_detail: grid            # summary | grid

  tracked_metrics: null  # null tracks all metrics; to track only plotted metrics, copy this list here.
  plot_metrics:          # plot_metrics has to be a subset of tracked_metrics (unless it is null)
    - empirical_loss
    - empirical_loss_grad_norm
    - empirical_loss_grad_norm_fc1
    - empirical_loss_grad_norm_fc2_normalized
    - mean_abs_output
    - mean_abs_residual
    - mean_output_grad_norm
    - mean_output_grad_norm_fc1
    - mean_output_grad_norm_fc2_normalized
    - mean_preactivation_norm_normalized
  plot_format: combined  # combined | individual | both
  plot_heatmaps: false

  output_dir: plots/init_scale_probe/debug
