experiment:
  seeds: [4]
  n: 10
  random_labels: false
  betas: [100, 500, 1000, .inf]
  epochs: 4000000
  eta: 1.0e-5
  m: 159056
  L: 1
  activation: tanh
  dataset: digits
  init_type: standard
  use_linearized: true
  same_noise: true
  track_jacobian: true
  tracked_metrics: [train_loss, feat_gram_lambda, lin_train_loss, nn_lin_param_dist, jacobian_dist]
  jac_probe_size: 10
  device: cuda
  track_every: 50000
  print_every: 100000
  checkpoint_state: metrics_only
run:
  ckpt_dir: "cld_checkpoints/shallow"
  save_ckpt: true
